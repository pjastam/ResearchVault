  <rect x="76" y="433" width="132" height="100" rx="6" class="card-3"/>
  <text x="142" y="475" text-anchor="middle" dominant-baseline="central" class="t-chip">build-zotero-</text>
  <text x="142" y="491" text-anchor="middle" dominant-baseline="central" class="t-chip">bundle.py</text>

  <rect x="220" y="433" width="132" height="100" rx="6" class="card-3"/>
  <text x="286" y="483" text-anchor="middle" dominant-baseline="central" class="t-chip">fetch-fulltext.py</text>

  <rect x="364" y="433" width="132" height="100" rx="6" class="card-3"/>
  <text x="430" y="483" text-anchor="middle" dominant-baseline="central" class="t-chip">yt-dlp</text>

  <rect x="508" y="433" width="132" height="100" rx="6" class="card-3"/>
  <text x="574" y="475" text-anchor="middle" dominant-baseline="central" class="t-chip">youtube-</text>
  <text x="574" y="491" text-anchor="middle" dominant-baseline="central" class="t-chip">transcript-api</text>

  <rect x="652" y="433" width="132" height="100" rx="6" class="card-3"/>
  <text x="718" y="483" text-anchor="middle" dominant-baseline="central" class="t-chip">whisper.cpp</text>

  <line x1="432" y1="548" x2="432" y2="560" class="arr-phase" marker-end="url(#arrow)"/>

