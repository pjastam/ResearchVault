      .panel-4 { fill: rgba(30,180,140,0.04); stroke: rgba(30,180,140,0.28); stroke-width: 0.5; }
      .panel-5 { fill: rgba(124,92,191,0.04); stroke: rgba(124,92,191,0.25); stroke-width: 0.5; }
