      .lbl-sub { fill: #5a6473; font-size: 9px; }
      .dot-1 { fill: #4a9eff; } .dot-2 { fill: #e8a735; } .dot-3 { fill: #e06c4a; }
      .dot-4 { fill: #2ecc9a; } .dot-5 { fill: #9d79e0; }
      .dot-num { fill: #0d1117; font-size: 9px; font-weight: 700; }
      .t-chip { fill: #e6edf3; font-size: 9.5px; font-weight: 600; }
