  <circle cx="40" cy="240" r="9" class="dot-2"/>
  <text x="40" y="244" text-anchor="middle" class="dot-num">2</text>
  <text x="58" y="244" class="lbl-2">FILTER</text>
  <text x="148" y="244" class="lbl-sub">— you decide Go/No-go</text>

