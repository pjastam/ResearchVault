  <rect x="76" y="269" width="168" height="100" rx="6" class="card-2"/>
  <text x="160" y="319" text-anchor="middle" dominant-baseline="central" class="t-chip">zotero-mcp</text>
  <text x="160" y="335" text-anchor="middle" dominant-baseline="central" class="t-chip">ChromaDB embeddings</text>

  <rect x="257" y="269" width="168" height="100" rx="6" class="card-2"/>
  <text x="341" y="319" text-anchor="middle" dominant-baseline="central" class="t-chip">index-score.py</text>

  <rect x="438" y="269" width="168" height="100" rx="6" class="card-2"/>
  <text x="522" y="319" text-anchor="middle" dominant-baseline="central" class="t-chip">summarize_item.py</text>

