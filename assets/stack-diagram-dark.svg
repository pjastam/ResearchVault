  <text x="178" y="80" class="lbl-sub">— into Zotero _inbox</text>

  <rect x="64" y="90" width="736" height="130" rx="8" class="panel-1"/>

  <rect x="76" y="105" width="168" height="100" rx="6" class="card-1"/>
  <text x="160" y="155" text-anchor="middle" dominant-baseline="central" class="t-chip">NetNewsWire</text>

  <rect x="257" y="105" width="168" height="100" rx="6" class="card-1"/>
  <text x="341" y="155" text-anchor="middle" dominant-baseline="central" class="t-chip">Zotero Connector</text>

  <rect x="438" y="105" width="168" height="100" rx="6" class="card-1"/>
