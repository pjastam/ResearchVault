  <rect x="438" y="761" width="350" height="100" rx="6" class="card-5"/>
  <text x="613" y="811" text-anchor="middle" dominant-baseline="central" class="t-chip">hyalo</text>

  <text x="410" y="908" text-anchor="middle" class="t-foot">Mac mini M4 · every building block runs locally</text>
