  <text x="40" y="572" text-anchor="middle" class="dot-num">4</text>
  <text x="58" y="572" class="lbl-4">BACKEND</text>
  <text x="178" y="572" class="lbl-sub">— dashed border = replaceable</text>

  <rect x="64" y="582" width="736" height="130" rx="8" class="panel-4"/>

  <rect x="76" y="597" width="170" height="100" rx="6" class="card-4"/>
  <text x="161" y="647" text-anchor="middle" dominant-baseline="central" class="t-chip">wiki_backend.py</text>

  <line x1="246" y1="647" x2="274" y2="647" class="arr-inner" marker-end="url(#arrow)"/>

