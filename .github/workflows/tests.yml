name: tests

on:
  push:
    paths:
      - '.claude/wiki_backend.py'
      - '.claude/test_wiki_backend.py'
      - '.claude/feedreader_fetch.py'
      - '.claude/test_feedreader_fetch.py'
      - '.claude/feedreader_identity.py'
      - '.claude/test_feedreader_identity.py'
      - '.claude/freshrss_utils.py'
      - '.claude/test_freshrss_utils.py'
      - '.claude/feedreader_labels.py'
      - '.claude/test_feedreader_labels.py'
      - '.claude/feedreader-server.py'
      - '.claude/test_feedreader_server.py'
      - '.claude/enrich-inbox.py'
      - '.claude/test_enrich_inbox.py'
      - '.claude/attach-transcript.py'
      - '.claude/test_attach_transcript.py'
      - '.claude/fetch-fulltext.py'
      - '.claude/test_fetch_fulltext.py'
      - '.claude/build-zotero-bundle.py'
      - '.claude/test_build_zotero_bundle.py'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - '.claude/wiki_backend.py'
      - '.claude/test_wiki_backend.py'
      - '.claude/feedreader_fetch.py'
      - '.claude/test_feedreader_fetch.py'
      - '.claude/feedreader_identity.py'
      - '.claude/test_feedreader_identity.py'
      - '.claude/freshrss_utils.py'
      - '.claude/test_freshrss_utils.py'
      - '.claude/feedreader_labels.py'
      - '.claude/test_feedreader_labels.py'
      - '.claude/feedreader-server.py'
      - '.claude/test_feedreader_server.py'
      - '.claude/enrich-inbox.py'
      - '.claude/test_enrich_inbox.py'
      - '.claude/attach-transcript.py'
      - '.claude/test_attach_transcript.py'
      - '.claude/fetch-fulltext.py'
      - '.claude/test_fetch_fulltext.py'
      - '.claude/build-zotero-bundle.py'
      - '.claude/test_build_zotero_bundle.py'

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s .claude -p 'test_*.py' -v
